name: elder_safety_mobile
description: 安居视界，面向家属的居家安全事件提醒与协作应用。
publish_to: none
version: 1.3.0+4012

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  video_player: ^2.14.1
  file_picker: ^13.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/native-video.txt
    - assets/manual.json
